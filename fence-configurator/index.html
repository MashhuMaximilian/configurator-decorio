<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#244f43"><title>Decorio · Configurator de împrejmuiri</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/shared-ui/styles/standalone.css"><link rel="stylesheet" href="/shared-ui/styles/panelControls.css"><link rel="stylesheet" href="./decorio.css"><script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script></head>
<body data-mobile-panel="catalog">
<main class="decorio-workspace">
 <aside class="catalog-panel shared-panel-controls" aria-label="Catalog produse">
  <div class="catalog-heading"><h1>Produse Decorio</h1><label>Familie<select id="family"></select></label><label>Caută model<input id="search" type="search" placeholder="Vega B, AL.101…"></label><div class="catalog-counter"><span id="product-count"></span><button id="coverage" class="link-button">Acoperire</button></div></div>
  <div id="products" class="product-grid" role="group" aria-label="Modele"></div><button id="more-products" hidden>Mai multe produse</button>
 </aside>
 <section class="scene-stage" aria-label="Previzualizare produs și proiect">
  <nav class="context-switch" aria-label="Context"><button data-context="product" aria-pressed="true">Produs</button><button data-context="project" aria-pressed="false">Proiect <span id="segment-count">0</span></button></nav>
  <div id="viewer"></div><div id="reference-only" hidden><img id="reference-photo" alt="Referința produsului Decorio"><p id="reference-reason"></p></div>
  <div id="editor" hidden><svg id="plan" viewBox="0 0 900 650" role="application" tabindex="0" aria-label="Plan 2D: desenează și selectează segmente"></svg></div>
  <div class="scene-toolbar"><button id="front">Din față</button><button id="fit">Încadrează</button><div id="view-switch" hidden><button data-view="3d" aria-pressed="true">3D</button><button data-view="2d" aria-pressed="false">2D</button></div></div>
  <div id="plan-tools" class="plan-tools" hidden><button id="draw" aria-pressed="false">Desenează</button><button id="select" aria-pressed="true">Încheie / selectează</button><button id="pan" aria-pressed="false">Deplasează planul</button><button id="zoom-in" aria-label="Mărește planul">＋</button><button id="zoom-out" aria-label="Micșorează planul">−</button></div>
  <div class="scene-caption"><strong id="scene-title"></strong><span id="scene-note"></span></div>
 </section>
 <aside class="properties-panel shared-panel-controls" aria-label="Configurare produs">
  <section class="panel-section product-properties"><p id="editing-context" class="eyebrow">PREVIZUALIZARE PRODUS</p><h2 id="product-name"></h2><div id="parameters" class="control-list"></div><p id="parameter-error" role="alert" hidden></p><p id="sku" class="subtle"></p>
   <div class="apply-controls"><button id="draw-product" class="primary">Desenează cu produsul</button><label id="apply-label" hidden>Aplică produsul pe<select id="apply-scope"><option value="segment">Segmentul selectat</option><option value="connected">Traseul conectat</option><option value="all">Întregul proiect</option></select></label><button id="apply-product" hidden>Aplică proprietățile</button></div>
  </section>
  <section id="layout-controls" class="panel-section" hidden><h3>Traseu</h3><p id="drawing-status" class="subtle" role="status"></p><div class="two-fields"><label>Lungime nouă (m)<input id="draw-length" class="number-input" type="number" min="0.1" max="500" step="0.01" value="5"></label><label>Unghi (°)<input id="draw-angle" class="number-input" type="number" step="1" value="0"></label></div><button id="numeric-segment">Adaugă segment numeric</button><p class="subtle">Din ultimul punct ales; primul segment pornește din origine. Unghiul este față de axa orizontală a planului.</p><label class="check"><input id="snap" type="checkbox" checked> Grilă 10 cm</label><label class="check"><input id="ortho" type="checkbox"> Aliniere la 90°</label>
   <label>Segment<select id="segment-select"></select></label><div class="two-fields"><label>Lungime traseu (m)<input id="segment-length" class="number-input" type="number" min="0.1" max="500" step="0.01"></label><button id="set-length">Modifică lungimea</button></div><button id="delete-segment">Șterge segmentul</button>
   <div id="node-controls" hidden><h3>Punct selectat</h3><div class="two-fields"><label>X (m)<input id="node-x" type="number" step="0.1"></label><label>Y (m)<input id="node-y" type="number" step="0.1"></label></div><button id="move-node">Mută punctul</button><button id="delete-node">Șterge punctul</button></div>
   <div id="gate-controls"><h3>Porți compatibile</h3><select id="gate-product" aria-label="Poartă compatibilă"></select><div class="two-fields"><label>Distanță de la început (m)<input id="gate-offset" type="number" step="0.01" min="0" value="0"></label><label>Deschidere<select id="gate-hand"><option value="left">Stânga</option><option value="right">Dreapta</option></select></label></div><button id="add-gate">Adaugă poartă</button><div id="gate-list"></div></div>
  </section>
  <section class="panel-section accordion-section"><button class="accordion-toggle" aria-expanded="false">Documentație și limite <span>＋</span></button><div class="accordion-panel" hidden><img id="product-photo" alt="Fotografia de referință Decorio"><p id="product-notes"></p><a id="product-source" target="_blank" rel="noopener">Pagina Decorio ↗</a><dl id="product-specs"></dl><div id="kit-included"></div></div></section>
  <section class="panel-section project-actions"><div class="summary"><span id="total-length">0 m</span><button id="show-bom">Componente și export</button></div><button id="redo" disabled>Refă operația</button><p id="connection-status" class="subtle"></p></section>
 </aside>
</main>
<nav class="mobile-navigation" aria-label="Panouri"><button data-panel="catalog" aria-pressed="true">Produse</button><button data-panel="properties">Configurează</button><button data-panel="layout">Traseu</button></nav>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="Închide">×</button></div><div id="dialog-content"></div></dialog>
<input id="import-json" type="file" accept="application/json,.json" hidden>
<script type="module" src="./js/decorio-app.js"></script></body></html>

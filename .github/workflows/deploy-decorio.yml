name: Deploy Decorio manually
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: decorio-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'MashhuMaximilian/configurator-decorio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PROJECT: configurator-360
      REGION: europe-central2
      SERVICE: configurator-decorio
      IMAGE: europe-central2-docker.pkg.dev/configurator-360/decorio/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/719238533149/locations/global/workloadIdentityPools/decorio-github/providers/decorio
          service_account: decorio-deployer@configurator-360.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and validate the dedicated image
        run: |
          gcloud auth configure-docker europe-central2-docker.pkg.dev --quiet
          docker build -f Dockerfile.cloudrun -t "$IMAGE:$GITHUB_SHA" .
          docker run --rm "$IMAGE:$GITHUB_SHA" nginx -t
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy only the existing Decorio service
        run: |
          test "$SERVICE" = configurator-decorio
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.latestReadyRevisionName)' > previous-revision.txt
          gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" --image="$IMAGE:$GITHUB_SHA" --service-account=decorio-runtime@configurator-360.iam.gserviceaccount.com --ingress=internal-and-cloud-load-balancing --no-default-url --quiet
          printf 'Previous Decorio revision: %s\n' "$(cat previous-revision.txt)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: decorio-rollback-revision
          path: previous-revision.txt

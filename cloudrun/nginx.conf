events {}
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 sendfile on;
 server_tokens off;
 server {
  listen 8080 default_server;
  server_name _;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  location = /healthz { return 200 'decorio'; }
  location / { return 421; }
 }
 server {
  listen 8080;
  server_name decorio.360configurator.com decorio.360konfigurator.de;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  return 308 https://decorio.360configurator.ro$request_uri;
 }
 server {
  listen 8080;
  server_name decorio.360configurator.ro localhost;
  absolute_redirect off;
  port_in_redirect off;
  root /usr/share/nginx/html;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cache-Control "no-cache" always;
  location = /healthz { return 200 'decorio'; }
  location = / { return 302 /configurator-garduri/$is_args$args; }
  location = /configurator-garduri { return 302 /configurator-garduri/$is_args$args; }
  location = /fence-configurator/ { return 302 /configurator-garduri/$is_args$args; }
  location = /configurator-garduri/ { try_files /fence-configurator/index.html =404; }
  location /configurator-garduri/ { rewrite ^/configurator-garduri/(.*)$ /fence-configurator/$1 last; }
  location /fence-configurator/ { try_files $uri =404; }
  location /shared-ui/ { try_files $uri =404; }
  location /shared-3d/ { try_files $uri =404; }
  location /vendor/ { try_files $uri =404; }
  location = /robots.txt { try_files $uri =404; }
  location = /version.json { try_files $uri =404; }
  location / { return 404; }
 }
}
